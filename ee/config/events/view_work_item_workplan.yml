description: >-
  A saved, nonempty workplan is displayed in the open workplan panel in view mode,
  once per panel opening and work item. Includes direct links and display after
  generation; excludes loading, empty, and editor-only states. Content updates
  and edit/save cycles do not add views within an already-counted opening;
  closing and reopening counts again. Measures UI display, not GraphQL content
  fetches or proof that the content was read.
