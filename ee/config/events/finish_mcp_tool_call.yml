---
description: Tracks MCP tool call finish event
internal_events: true
action: finish_mcp_tool_call
classification: duo
identifiers:
- user
- namespace
product_group: ai_model_services
product_categories:
- duo_agent_platform
extra_trackers:
- tracking_class: Gitlab::Tracking::AiTracking
additional_properties:
  request_id:
    description: JSON-RPC request id of the tool call. The MCP Server is stateless and does not issue session ids.
  tool_name:
    description: Name of the MCP tool being called
  has_tool_call_success:
    description: Whether the tool call was successful
  failure_reason:
    description: Reason for failure if the tool call failed
  error_status:
    description: Error status if the tool call failed
  mcp_client_name:
    description: The MCP client name, from the clientInfo in the request _meta or else the User-Agent
  mcp_client_version:
    description: The MCP client version, from the same source as mcp_client_name
milestone: '18.6'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/issues/574629
tiers:
- premium
- ultimate
