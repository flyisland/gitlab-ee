---
token_type: "Hashicorp Terraform user/org API token"
class_name: "HashicorpTerraformClient"
partner_name: "hashicorp"
endpoint: "https://app.terraform.io/api/v2/account/details"
http_method: "get"
auth_style: "bearer"
token_pattern: '\A[a-zA-Z0-9]{14}\.atlasv1\.[a-zA-Z0-9_-]{60,70}\z'
sample_token: "aaaaaaaaaaaaaa.atlasv1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
rate_limit_key: "partner_hashicorp_api"
doc_url: "https://developer.hashicorp.com/terraform/cloud-docs/api-docs/account"
status_map:
  "200": "active"
  "401": "inactive"
  "429": "rate_limit"
  "500": "network_error"
  "502": "network_error"
  "503": "network_error"
  "504": "network_error"
