- title: Spend
  duoPrompts:
  - Which model is costing us the most credits?
  - How are credits trending, excluding Chat?
  - Which capabilities drive spend on each model?
  - Why is Chat excluded from the credits chart?
  panels:
  # Totals all credits for now; narrows to model-attributed credits once modelUsed
  # is filterable, which is when this and the Credits tile diverge.
  - title: Credits by model
    visualization:
      type: Glql
      options:
        showActions: true
        showTrends: true
      data:
        type: glql
        query:
          glql: |
            display: stat
            mode: analytics
            query: type = DuoWorkflow and created >= "%{startDate}" and created <= "%{endDate}"
            metrics: creditsUsedSum
            displayConfig:
              compact: true
              unit: credits
    gridAttributes:
      yPos: 0
      xPos: 0
      width: 12
      height: 17
  # The top capabilities get their own stacked segment and legend entry; the rest roll
  # into an Other segment.
  - title: Credits by model, by capability
    tooltip:
      description: Credits consumed by each model in the selected date range, stacked by capability. Credits are fetched from billing after a session is billed and can lag behind the session counts, so recent totals can understate spend.
    visualization:
      type: Glql
      options:
        showActions: true
      data:
        type: glql
        query:
          glql: |
            display: barList
            mode: analytics
            query: type = DuoWorkflow and created >= "%{startDate}" and created <= "%{endDate}"
            dimensions: model, flowType
            metrics: creditsUsedSum
            displayConfig:
              maxSeries: 5
    gridAttributes:
      yPos: 17
      xPos: 0
      width: 12
      height: 41
  - title: Credits
    tooltip:
      description: Total credits consumed by GitLab Duo Agent Platform (DAP) sessions in the selected date range. Credits are fetched from billing after a session is billed and can lag behind the session counts, so recent totals can understate spend.
    visualization:
      type: Glql
      options:
        showActions: true
      data:
        type: glql
        query:
          glql: |
            display: stat
            mode: analytics
            query: type = DuoWorkflow and created >= "%{startDate}" and created <= "%{endDate}"
            metrics: creditsUsedSum
            displayConfig:
              compact: true
              unit: credits
              description: Total credits consumed over the selected period
    gridAttributes:
      yPos: 58
      xPos: 0
      width: 6
      height: 17
  - title: Chat
    tooltip:
      description: Credits consumed by Chat sessions in the selected date range. Credits are fetched from billing after a session is billed and can lag behind the session counts, so recent totals can understate spend.
    visualization:
      type: Glql
      options:
        showActions: true
        showTrends: true
      data:
        type: glql
        query:
          glql: |
            display: stat
            mode: analytics
            # chat and agentic chat are the two chat session flow types on this source
            query: type = DuoWorkflow and flowType in ("chat", "agentic_chat/v1") and created >= "%{startDate}" and created <= "%{endDate}"
            metrics: creditsUsedSum
            displayConfig:
              compact: true
              unit: credits
              description: Credits consumed by Chat sessions
    gridAttributes:
      yPos: 58
      xPos: 6
      width: 6
      height: 17
  - title: Credits over time
    tooltip:
      description: Credits consumed over the selected period, stacked by capability. Credits are fetched from billing after a session is billed and can lag behind the session counts, so recent totals can understate spend.
    visualization:
      type: Glql
      options:
        showActions: true
      data:
        type: glql
        query:
          glql: |
            display: columnChart
            mode: analytics
            query: type = DuoWorkflow and created >= "%{startDate}" and created <= "%{endDate}"
            dimensions: created(%{dynamicGranularity}), flowType
            metrics: creditsUsedSum
            # the second key keeps paging stable, since flow types in a bucket tie on `created`
            sort: created asc, creditsUsedSum desc
            displayConfig:
              maxSeries: 5
    gridAttributes:
      yPos: 75
      xPos: 0
      width: 12
      height: 53
