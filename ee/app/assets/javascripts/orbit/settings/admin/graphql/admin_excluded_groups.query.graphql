#import "./admin_group.fragment.graphql"

# @feature_category: knowledge_graph
query getOrbitAdminExcludedGroups($first: Int!, $after: String) {
  knowledgeGraphExcludedNamespaces(first: $first, after: $after) @gl_introduced(version: "19.5.0") {
    nodes {
      ...OrbitAdminGroup
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
