# @feature_category: artifact_registry
#import "~/graphql_shared/fragments/page_info.fragment.graphql"

query getArtifactRegistryVersionFiles(
  $organizationId: OrganizationsOrganizationID!
  $name: String!
  $artifactId: ID!
  $versionId: ID!
  $first: Int
  $last: Int
  $before: String
  $after: String
) {
  organization(id: $organizationId) {
    id
    artifactRegistryRepository(name: $name) {
      name
      format
      kind
      # The page arguments repeat here and on `files` below: Apollo prunes a variable only when
      # it appears in the removed `@client` field's own arguments, so one used solely on the
      # nested connection reaches the server declared but unused (`queries_spec.js`).
      version(
        id: $versionId
        artifactId: $artifactId
        first: $first
        last: $last
        before: $before
        after: $after
      ) @client {
        id
        files(first: $first, last: $last, before: $before, after: $after) {
          nodes {
            ... on ArtifactRegistryMavenVersionFile {
              id
              fileName
              sizeBytes
              createdAt
              md5
              sha1
              sha256
              sha512
            }
            ... on ArtifactRegistryNpmVersionFile {
              id
              fileName
              sizeBytes
              createdAt
              sha256
            }
          }
          pageInfo {
            ...PageInfo
          }
        }
      }
    }
  }
}
