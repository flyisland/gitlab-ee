#import "~/graphql_shared/fragments/page_info.fragment.graphql"

fragment ComplianceFrameworkConnectionDetails on ComplianceFrameworkConnection {
  nodes {
    id
    name
    default
    description
    color
    updatedAt
    namespaceId
    pipelineConfigurationFullPath
    scanExecutionPolicies(first: 100) {
      # eslint-disable-next-line @graphql-eslint/require-selections -- id not needed for this query
      nodes {
        name
        source {
          ... on GroupSecurityPolicySource {
            namespace {
              id
              name
              fullPath
            }
          }
        }
      }
    }
    scanResultPolicies(first: 100) {
      # eslint-disable-next-line @graphql-eslint/require-selections -- id not needed for this query
      nodes {
        name
        source {
          ... on GroupSecurityPolicySource {
            namespace {
              id
              name
              fullPath
            }
          }
        }
      }
    }
    pipelineExecutionPolicies(first: 100) {
      # eslint-disable-next-line @graphql-eslint/require-selections -- id not needed for this query
      nodes {
        name
        source {
          ... on GroupSecurityPolicySource {
            namespace {
              id
              name
              fullPath
            }
          }
        }
      }
    }
    vulnerabilityManagementPolicies(first: 100) {
      # eslint-disable-next-line @graphql-eslint/require-selections -- id not needed for this query
      nodes {
        name
        source {
          ... on GroupSecurityPolicySource {
            namespace {
              id
              name
              fullPath
            }
          }
        }
      }
    }
    complianceRequirements {
      nodes {
        id
        name
        description
        complianceRequirementsControls {
          nodes {
            id
            name
            controlType
            expression
            externalControlName
            externalUrl
            pingEnabled
          }
        }
      }
    }
  }
  pageInfo {
    ...PageInfo
  }
}
