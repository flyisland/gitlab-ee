# @feature_category: ai_agents

query getAvailableAiItemNames(
  $groupId: GroupID
  $projectId: ProjectID
  $itemTypes: [AiCatalogItemType!]
) {
  aiCatalogConfiguredItems(groupId: $groupId, projectId: $projectId, itemTypes: $itemTypes) {
    nodes {
      id
      item {
        id
        name
      }
    }
  }
}
