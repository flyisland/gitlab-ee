# @feature_category: ai_agents
query GetWorkflowAuditEvents(
  $workflowId: AiDuoWorkflowsWorkflowID!
  $after: String
  $before: String
  $first: Int
  $last: Int
) {
  duoWorkflowWorkflows(workflowId: $workflowId) {
    nodes {
      id
      workflowDefinition
      humanStatus
      auditEvents(after: $after, before: $before, first: $first, last: $last) {
        nodes {
          id
          eventName
          createdAt
          details
          ipAddress
          workflowId
          author {
            id
            name
            username
            avatarUrl
            webPath
          }
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
      }
    }
  }
}
