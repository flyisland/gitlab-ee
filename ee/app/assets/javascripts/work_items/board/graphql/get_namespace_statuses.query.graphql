# @feature_category: portfolio_management
query getBoardNamespaceStatusesEE($fullPath: ID!, $ids: [WorkItemsStatusesStatusID!]) {
  namespace(fullPath: $fullPath) {
    id
    rootNamespace {
      id
      statuses(ids: $ids) {
        nodes {
          id
          name
          iconName
          color
          category
          description
          position
        }
      }
    }
    # Used to order statuses within a category by their configured lifecycle position;
    # a status's own `position` isn't meaningful outside a lifecycle (see sortStatusesByLifecycle).
    workItemTypes {
      nodes {
        id
        widgetDefinitions {
          type
          ... on WorkItemWidgetDefinitionStatus {
            allowedStatuses {
              id
            }
          }
        }
      }
    }
  }
}
