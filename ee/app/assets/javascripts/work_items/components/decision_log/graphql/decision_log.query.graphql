#import "~/graphql_shared/fragments/user.fragment.graphql"

# @feature_category: team_planning
query workItemDecisions($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id
      features {
        decisionLog {
          decisions {
            nodes {
              id
              title
              description
              resolutionRationale
              resolvedAt
              noteUrl
              discussionId
              sourceLink
              author {
                ...User
              }
              resolvedBy {
                ...User
              }
              options {
                nodes {
                  id
                  content
                  selected
                }
              }
            }
          }
        }
      }
    }
  }
}
