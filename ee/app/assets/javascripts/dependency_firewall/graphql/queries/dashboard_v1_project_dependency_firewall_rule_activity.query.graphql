# @feature_category: dependency_firewall
#import "../fragments/dashboard_v1_dependency_firewall_rule_activity.fragment.graphql"

query getDashboardV1ProjectDependencyFirewallRuleActivity($fullPath: ID!, $from: Date) {
  dependencyFirewall: project(fullPath: $fullPath) {
    id
    dependencyFirewallActivitySummary(from: $from) {
      blocked
      warned
      totalTriggers
      activeRules
      blockingRules
      warningRules
    }
    dependencyFirewallRuleActivity(from: $from) {
      ...DependencyFirewallRuleActivityFields
    }
  }
}
