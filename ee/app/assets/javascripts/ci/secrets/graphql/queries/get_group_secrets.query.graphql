# @feature_category: secrets_management
query getGroupSecrets($fullPath: ID!) {
  secretsList: groupSecrets(groupPath: $fullPath) {
    edges {
      node {
        createdAt
        description
        environment
        metadataVersion
        name
        protected
        rotationInfo {
          rotationIntervalDays
          status
        }
        status
        group {
          id
          fullPath
        }
      }
    }
  }
}
