# @feature_category: secrets_management
query getProjectSecretManagerStatus($fullPath: ID!) {
  secretsManager: projectSecretsManager(projectPath: $fullPath) {
    entity: project {
      id
      archived
      markedForDeletion
    }
    readOnly @gl_introduced(version: "19.4.0")
    writeDenialReason @gl_introduced(version: "19.5.0")
    status
    userPermissions {
      createSecrets
      updateSecrets
      deleteSecrets
    }
  }
}
