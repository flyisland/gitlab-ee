#import "./scan_profile.fragment.graphql"

# @feature_category: security_testing_configuration
query GroupAvailableSecurityScanProfiles($fullPath: ID!, $gitlabRecommended: Boolean) {
  group(fullPath: $fullPath) {
    id
    name
    userPermissions {
      createSecurityScanProfiles
      updateSecurityScanProfiles
      deleteSecurityScanProfiles
    }
    availableSecurityScanProfiles(gitlabRecommended: $gitlabRecommended) {
      ...ScanProfileFields
    }
  }
}
