# @feature_category: security_testing_configuration
query scanProfileStatuses($fullPath: ID!) {
  project(fullPath: $fullPath) {
    id
    scanProfileStatuses @gl_introduced(version: "19.0.0") {
      status
      consecutiveFailureCount
      consecutiveSuccessCount
      lastScanAt
      buildId
      scanProfile {
        id
      }
    }
  }
}
