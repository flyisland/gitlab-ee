fragment BaseAiCatalogItem on AiCatalogItem {
  id
  createdAt
  itemType
  description
  descriptionHtml @gl_introduced(version: "19.1.0")
  foundationalFlowReference
  foundational @gl_introduced(version: "18.10.0")
  ... on AiCatalogAgent {
    foundational @gl_introduced(version: "18.7.0")
  }
  ... on AiCatalogFlow {
    foundational @gl_introduced(version: "18.7.0")
  }
  name
  public
  updatedAt
  softDeleted
  latestVersion {
    id
    createdAt
    updatedAt
    createdBy {
      id
      name
      username
      webUrl
    }
  }
  userPermissions {
    adminAiCatalogItem
  }
  starCount
  starred
  last30DayUsageCount
  __typename
}
