# @feature_category: compliance_management

mutation updateAiToolRule($input: UpdateAiToolRuleInput!) {
  updateAiToolRule(input: $input) {
    toolRule {
      id
      webAccess
      localAccess
      backgroundAccess
      configuredAccess @gl_introduced(version: "19.5.0") {
        webAccess
        localAccess
        backgroundAccess
      }
      defaultAccess @gl_introduced(version: "19.5.0") {
        webAccess
        localAccess
        backgroundAccess
      }
    }
    errors
  }
}
