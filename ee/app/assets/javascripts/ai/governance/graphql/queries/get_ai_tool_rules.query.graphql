# @feature_category: compliance_management

query getAiToolRules($fullPath: ID!, $first: Int, $last: Int, $after: String, $before: String) {
  aiToolRules(fullPath: $fullPath, first: $first, last: $last, after: $after, before: $before)
    @client {
    nodes {
      id
      name
      actionType
      category
      source
      webAccess
      localAccess
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
