#import "~/graphql_shared/fragments/user.fragment.graphql"

fragment FlowFragment on DuoWorkflow {
  id
  title
  status
  humanStatus
  createdAt
  updatedAt
  workflowDefinition
  user @gl_introduced(version: "19.1.0") {
    ...User
  }
  workItem @gl_introduced(version: "19.1.0") {
    id
    iid
    webUrl
  }
  mergeRequest @gl_introduced(version: "19.1.0") {
    id
    iid
    webUrl
  }
  latestCheckpoint {
    duoMessages {
      content
      messageType
    }
  }
  userPermissions {
    updateDuoWorkflow
    resumeDuoWorkflow
  }
  project {
    id
    name
    webUrl
    fullPath
    namespace {
      id
      name
      webUrl
    }
  }
}
