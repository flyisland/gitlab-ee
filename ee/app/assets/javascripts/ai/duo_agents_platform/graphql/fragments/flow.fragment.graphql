#import "~/graphql_shared/fragments/user.fragment.graphql"

fragment FlowFragment on DuoWorkflow {
  id
  title
  status
  humanStatus
  updatedAt
  workflowDefinition
  modelMetadataName @gl_introduced(version: "19.2.0")
  modelMetadataIdentifier @gl_introduced(version: "19.2.0")
  flowMetadataVersion @gl_introduced(version: "19.3.0")
  sourceType @gl_introduced(version: "19.4.0")
  sourceLink @gl_introduced(version: "19.4.0")
  user @gl_introduced(version: "19.1.0") {
    ...User
  }
  workItem @gl_introduced(version: "19.1.0") {
    id
    iid
    title
    webPath
  }
  mergeRequest @gl_introduced(version: "19.1.0") {
    id
    iid
    title
    webPath
  }
  userPermissions {
    updateDuoWorkflow
    resumeDuoWorkflow
  }
  project {
    id
    name
    webPath
    fullPath
    namespace {
      id
      name
      webPath
    }
  }
}
