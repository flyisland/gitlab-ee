# @feature_category: duo_agent_platform

# Project-scoped lookup of service account roles, used to show the role a flow's
# service account holds on this project. Scoped to the project (not the user), so
# it returns only this project's memberships rather than every membership the
# account has across projects. Not filtered by access level, since a service
# account's role may have been changed from the Developer default. Bounded by an
# explicit `first` so the page size is intentional rather than the connection default.
query getProjectServiceAccountRoles($fullPath: ID!) {
  project(fullPath: $fullPath) {
    id
    projectMembers(userTypes: [SERVICE_ACCOUNT], first: 100) {
      nodes {
        id
        accessLevel {
          humanAccess
        }
        user {
          id
        }
      }
    }
  }
}
