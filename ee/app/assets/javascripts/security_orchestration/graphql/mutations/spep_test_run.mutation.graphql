# @feature_category: security_policy_management
mutation spepTestRun($policyId: SecurityPolicyID!, $projectPath: ID!) {
  pipelineExecutionSchedulePolicyTestRun(
    input: { policyId: $policyId, projectPath: $projectPath }
  ) {
    testRun {
      id
      state
      startedAt
      finishedAt
      duration
      errorMessage
      project {
        id
        fullPath
        name
      }
    }
    pipeline {
      id
      status
    }
    errors
  }
}
