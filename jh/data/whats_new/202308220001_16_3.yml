- name: 价值流仪表盘中的新速度指标
  description: |  # Do not modify this line, instead modify the lines below.
    价值流仪表盘的功能通过发布新指标而得到增强：**合并请求（MR）吞吐量** 和 **已关闭的议题总数**（速度）。在极狐GitLab 中，**MR 吞吐量** 是每月合并的合并请求的数量，**已关闭的议题总数** 是在某个时间点关闭的流程项的数量。

    通过这些指标，您可以识别出低生产力或高生产力的月份以及[合并请求和代码审查流程](https://docs.gitlab.cn/jh/user/analytics/merge_request_analytics.html)的效率。您可以衡量[价值流交付](https://docs.gitlab.cn/jh/user/group/value_stream_analytics/)的速度是否正在增加。

    随着时间的推移，这些指标会积累 MR 和议题的历史数据。团队可以使用这些数据来确定交付率是否有所增加或需要改进，并为他们可以交付的工作量提供更准确的预估。
  stage: Plan
  self-managed: true
  gitlab-com: true
  available_in: [旗舰版]
  documentation_link: https://docs.gitlab.cn/jh/user/analytics/value_streams_dashboard.html
  #  image_url: https://about.gitlab.com/images/16_3/16.3_vsd.mr_iss.png
  published_at: 2023-08-22
  release: 16.3

