- name: 扫描结果策略的附加过滤
  description: |  # Do not modify this line, instead modify the lines below.
    确定安全或合规性扫描的哪些结果可操作是安全和合规团队面临的重大挑战。扫描结果策略的精细过滤器将帮助您消除干扰，识别最需要您关注的漏洞或违规行为。这些新的过滤器和过滤器更新将简化您的工作流程：

    - 状态：状态规则更改引入了对“新”漏洞与“之前存在”漏洞的更直观的展示。新的状态字段 `new_needs_triage` 可以仅过滤需要分类的新漏洞。
    - 期限：根据检测日期，当漏洞超出 SLA（天、月或年）范围时，创建策略以强制执行批准。
    - 可用修复：缩小策略的重点，以解决具有可用修复的依赖项。
    - 误报：过滤掉漏洞提取工具检测到的误报（SAST 结果）以及通过 Rezilion 检测到的误报（容器扫描和依赖项扫描结果）。
  stage: Govern
  self-managed: true
  gitlab-com: true
  available_in: [旗舰版]
  documentation_link: https://docs.gitlab.cn/jh/user/application_security/policies/scan-result-policies.html
  #  image_url: https://about.gitlab.com/images/16_3/security-policy-filters-compressed.png
  published_at: 2023-08-22
  release: 16.3

