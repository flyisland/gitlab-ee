- name: 项目级价值流分析的自定义价值流
  description: | # Do not modify this line, instead modify the lines below.
    为了提高整个工作流的可见性，我们向项目级价值流分析 (VSA) 添加了[概述阶段](https://docs.gitlab.cn/jh/user/group/value_stream_analytics)和[创建自定义价值流](https://docs.gitlab.cn/jh/user/group/value_stream_analytics/#create-a-value-stream-with-custom-stages)的选项。

