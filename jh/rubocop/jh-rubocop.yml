# default rubocop rules, https://github.com/rubocop/rubocop/blob/master/config/default.yml
# inherit rubocop config from gitlab-styles, https://gitlab.com/gitlab-org/ruby/gems/gitlab-styles/-/blob/master/rubocop-default.yml
# upstream define customize rubocop rules in folder gitlab/rubocop/
# upstream skip rubocop in .rubocop_todo.yml, .rubocop_todo/*.yml

Rails/Pluck:
  Enabled: false

AllCops:
  Exclude:
    - 'jh/vendor/gems/omniauth-cas3/**/*'
    - 'jh/vendor/bundle/**/*'
    - 'qa/vendor/bundle/**/*'

Gemfile/MissingFeatureCategory:
  Enabled: false
  Exclude:
    - jh/**/*.rb

RSpec/FeatureCategory:
  Exclude:
    - jh/**/*.rb

Cop/ActiveRecordAssociationReload:
  Enabled: true
  Exclude:
    - 'jh/spec/**/*'
    - 'jh/ee/spec/**/*'

RSpec/ExampleWithoutDescription:
  Exclude:
    - jh/spec/**/*.rb

RSpec/NoExpectationExample:
  Exclude:
    - 'jh/spec/features/ci_shared_runner_warnings_spec.rb'
    - 'jh/spec/lib/gitee/connection_spec.rb'
    - 'jh/spec/lib/gitlab/dingtalk/client_spec.rb'

RSpec/Dialect:
  Exclude:
    - 'jh/spec/models/gitlab_subscriptions/features_spec.rb'

RSpec/RepeatedSubjectCall:
  Exclude:
    - 'jh/spec/services/password_expiration/send_notification_email_service_spec.rb'

RSpec/PendingWithoutReason:
  Exclude:
    - 'jh/spec/tasks/gitlab/db_rake_spec.rb'

RSpec/RemoveConst:
  Exclude:
    - 'jh/spec/support/helpers/jh/version_dot_helpers.rb'

RSpec/RailsControllerTesting:
  Exclude:
    - 'jh/spec/controllers/**/*'
    - 'jh/spec/requests/**/*'

RSpec/SubjectDeclaration:
  Exclude:
    - 'jh/spec/lib/jh/gitlab/expiring_subscription_message_spec.rb'
    - 'jh/spec/services/commits/fetch_effective_lines_count_service_spec.rb'
    - 'jh/spec/services/password_expiration/send_notification_email_service_spec.rb'

Lint/RedundantCopDisableDirective:
  Enabled: false

Gitlab/DocumentationLinks/HardcodedUrl:
  Exclude:
    - 'jh/danger/documentation/Dangerfile'
    - 'jh/tooling/danger/product_intelligence.rb'
    - 'jh/tooling/danger/product_intelligence.rb'

Gitlab/BoundedContexts:
  Exclude:
    - app/**/*.rb
    - lib/**/*.rb
    - ee/**/*.rb
    - jh/**/*.rb

Gitlab/FeatureFlagWithoutActor:
  Exclude:
    - jh/**/*

RSpec/NamedSubject:
  Exclude:
    - jh/**/*.rb

Style/InlineDisableAnnotation:
  Exclude:
    - jh/**/*.rb

Gitlab/AvoidGitlabInstanceChecks:
  Exclude:
    - jh/**/*.rb

CodeReuse/ActiveRecord:
  Exclude:
    - jh/app/controllers/**/*.rb
    - jh/app/helpers/**/*.rb
    - jh/spec/**/*.rb
    - jh/app/models/**/*.rb
    - jh/lib/tasks/**/*.rake

Gitlab/NamespacedClass:
  Exclude:
    - jh/app/controllers/*.rb
    - jh/app/validators/*.rb

Gitlab/ModuleWithInstanceVariables:
  Exclude:
    - jh/app/controllers/**/*.rb
    - jh/app/mailers/**/*.rb

# temp disable
Style/AndOr:
  Exclude:
    - jh/app/controllers/jh/users/terms_controller.rb

Style/ClassAndModuleChildren:
  Exclude:
    - jh/app/controllers/concerns/jh/spammable_actions/captcha_check/html_format_actions_support.rb

Style/FormatString:
  Exclude:
    - jh/lib/jh/gitlab/expiring_subscription_message.rb
    - jh/app/components/jh/billing/plan_component.rb

# Add compatibility of jh/qa folder
Rails/FilePath:
  Exclude:
    - 'jh/qa/**/*'

Layout/LineLength:
  AllowedPatterns: ['^RSpec\.describe\s.*\sdo']
  Exclude:
    - jh/lib/jh/gitlab/project_template.rb
    - jh/lib/jh/gitlab/expiring_subscription_message.rb
    - jh/spec/lib/gitlab/project_template_spec.rb
    - jh/spec/lib/jh/gitlab/expiring_subscription_message_spec.rb
    - jh/spec/requests/api/graphql/mutations/issues/update_spec.rb

Scalability/IdempotentWorker:
